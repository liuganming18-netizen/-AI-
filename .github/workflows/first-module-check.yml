name: 第一模块基础检查
on:
  push:
    branches: [first-module-running-market]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 运行基础测试
        run: npm test
      - name: 检查服务脚本语法
        run: node --check server.js
